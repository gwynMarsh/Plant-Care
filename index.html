<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Plant Care & Fertilizer Tracker</title>
  
 <!-- Emoji Favicon-->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>
<body>

  <!-- MODAL: Edit Plant -->
  <div id="edit-modal">
    <div class="card" style="width: 100%; max-width: 360px; margin: 0;">
      <div style="font-weight: 900; margin-bottom: 12px;">Edit Plant Settings</div>
      <div class="input-group">
        <input type="hidden" id="edit-id">
        <div>
          <label>Plant Name</label>
          <input type="text" id="edit-name">
        </div>
        <div>
          <label>Fertilizer Assignment</label>
          <select id="edit-type"></select>
        </div>
        <div>
          <label>Fertilize Every (Days)</label>
          <input type="number" id="edit-interval" min="1">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary btn-half" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary btn-half" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <div class="header-row">
    <h2 id="page-title">Fertilizer Schedule</h2>
    <button id="theme-btn" class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- TAB 1: SCHEDULE -->
  <div id="tab-schedule" class="tab-content active">
    <button class="btn btn-secondary" style="margin-bottom: 16px;" onclick="toggleAddForm()">+ Bulk Register Plants</button>

    <div id="add-plant-card" class="card" style="display: none;">
      <div style="font-weight: 900; margin-bottom: 12px;">Add Multiple Plants</div>
      <div class="input-group">
        <div>
          <label>Plant Names (Separate by commas or new lines)</label>
          <textarea id="bulk-names" rows="4" placeholder="e.g., Monstera, Bird's Nest Fern"></textarea>
        </div>
        <div>
          <label>Fertilizer Assignment</label>
          <select id="bulk-type"></select>
        </div>
        <div>
          <label>Fertilize Every (Days)</label>
          <input type="number" id="bulk-interval" value="14" min="1">
        </div>
        <div>
          <label>Last Fertilized Date</label>
          <input type="date" id="bulk-date">
        </div>
      </div>
      <button class="btn btn-primary" onclick="bulkSavePlants()">Save All Plants</button>
    </div>

    <div id="plant-list"></div>
  </div>

  <!-- TAB 2: CALCUMontserratR -->
  <div id="tab-calcuMontserratr" class="tab-content">
    <div class="card">
      <div style="font-weight: 900; margin-bottom: 12px;">Mix CalcuMontserratr</div>
      <div class="input-group">
        <div>
          <label>Water Volume (Liters)</label>
          <input type="number" id="calc-volume" value="1.5" step="0.1" oninput="runCalcuMontserratr()">
        </div>
        <div>
          <label>Select Fertilizer Recipe</label>
          <select id="calc-recipe" onchange="runCalcuMontserratr()"></select>
        </div>
      </div>
      <div class="calc-result" id="recipe-output"></div>
    </div>
  </div>

  <!-- TAB 3: LOGS & SYNC -->
  <div id="tab-logs" class="tab-content">
    <div class="card">
      <div style="font-weight: 900; margin-bottom: 12px;">iCloud Backup & Sync</div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" onclick="exportJSON()">Export JSON</button>
        <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">Import JSON</button>
      </div>
      <input type="file" id="file-input" style="display: none;" accept=".json" onchange="importJSON(event)">
    </div>

    <div class="card">
      <div style="font-weight: 900; margin-bottom: 12px;">Fertilization History</div>
      <div id="logs-list"></div>
    </div>
  </div>

  <div class="app-footer">© 2026 • Plant Care Tracker</div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('schedule', 'Fertilizer Schedule')">
      <span class="nav-icon">🪴</span><span>Schedule</span>
    </button>
    <button class="nav-item" onclick="switchTab('calcuMontserratr', 'Mix CalcuMontserratr')">
      <span class="nav-icon">🧪</span><span>CalcuMontserratr</span>
    </button>
    <button class="nav-item" onclick="switchTab('logs', 'Logs & Backup')">
      <span class="nav-icon">📋</span><span>Logs</span>
    </button>
  </div>

  <!-- External Database Link -->
  <script src="db.js"></script>

  <script>
    let plants = [];
    let logs = [];

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
      localStorage.setItem('app-theme', isDark ? 'dark' : 'light');
    }

    function formatDateDisplay(isoString) {
      if (!isoString) return "Unknown";
      const date = new Date(isoString);
      return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function getTodayInputFormat() {
      const today = new Date();
      return today.toISOString().split('T')[0];
    }

    window.onload = function() {
      if (localStorage.getItem('app-theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('theme-btn').innerText = '☀️';
      }
      document.getElementById('bulk-date').value = getTodayInputFormat();
      
      populateDropdowns();
      loadData();
      renderSchedule();
      runCalcuMontserratr();
    };

    function populateDropdowns() {
      const bulkSelect = document.getElementById('bulk-type');
      const calcSelect = document.getElementById('calc-recipe');
      const editSelect = document.getElementById('edit-type');
      
      for (const [key, data] of Object.entries(recipeDb)) {
        bulkSelect.add(new Option(data.name, key));
        calcSelect.add(new Option(data.name, key));
        editSelect.add(new Option(data.name, key));
      }
    }

    function loadData() {
      plants = JSON.parse(localStorage.getItem('plant_care_plants') || '[]');
      logs = JSON.parse(localStorage.getItem('plant_care_logs') || '[]');
    }

    function saveData() {
      localStorage.setItem('plant_care_plants', JSON.stringify(plants));
      localStorage.setItem('plant_care_logs', JSON.stringify(logs));
    }

    function switchTab(tabId, title) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById('tab-' + tabId).classList.add('active');
      document.getElementById('page-title').innerText = title;

      const navIndex = tabId === 'schedule' ? 0 : tabId === 'calcuMontserratr' ? 1 : 2;
      document.querySelectorAll('.nav-item')[navIndex].classList.add('active');

      if (tabId === 'logs') renderLogs();
    }

    function toggleAddForm() {
      const form = document.getElementById('add-plant-card');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    function bulkSavePlants() {
      const textInput = document.getElementById('bulk-names').value;
      const recipeKey = document.getElementById('bulk-type').value;
      const interval = parseInt(document.getElementById('bulk-interval').value, 10) || 14;
      let dateInput = document.getElementById('bulk-date').value;
      
      if (!textInput.trim()) return;
      if (!dateInput) dateInput = getTodayInputFormat();

      const names = textInput.split(/,|\n/).map(n => n.trim()).filter(n => n.length > 0);
      const fertilizerName = recipeDb[recipeKey].name;

      names.forEach(name => {
        plants.push({
          id: 'p_' + Date.now() + Math.floor(Math.random() * 1000),
          name: name,
          type: fertilizerName,
          interval: interval,
          lastFertilized: dateInput
        });
      });

      saveData();
      renderSchedule();
      
      document.getElementById('bulk-names').value = '';
      toggleAddForm();
    }

    function editFertilizerDate(id, newDate) {
      if (!newDate) return;
      const plant = plants.find(p => p.id === id);
      if (plant) {
        plant.lastFertilized = newDate;
        saveData();
        renderSchedule();
      }
    }

    function waterPlant(id) {
      const plant = plants.find(p => p.id === id);
      if (!plant) return;

      const today = getTodayInputFormat();
      plant.lastFertilized = today;

      logs.unshift({
        plantName: plant.name,
        type: plant.type,
        date: formatDateDisplay(today)
      });

      if (logs.length > 1000) {
        logs = logs.slice(0, 1000);
      }

      saveData();
      renderSchedule();
    }

    function openEditModal(id) {
      const plant = plants.find(p => p.id === id);
      if (!plant) return;
      
      document.getElementById('edit-id').value = plant.id;
      document.getElementById('edit-name').value = plant.name;
      document.getElementById('edit-interval').value = plant.interval;
      
      const editSelect = document.getElementById('edit-type');
      for (let i = 0; i < editSelect.options.length; i++) {
        if (editSelect.options[i].text === plant.type) {
          editSelect.selectedIndex = i;
          break;
        }
      }
      
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    function saveEdit() {
      const id = document.getElementById('edit-id').value;
      const plant = plants.find(p => p.id === id);
      if (!plant) return;

      const newName = document.getElementById('edit-name').value.trim();
      const newInterval = parseInt(document.getElementById('edit-interval').value, 10);
      const recipeKey = document.getElementById('edit-type').value;

      if (newName && newInterval > 0) {
        plant.name = newName;
        plant.interval = newInterval;
        plant.type = recipeDb[recipeKey].name;
        
        saveData();
        renderSchedule();
        closeEditModal();
      }
    }

    function deletePlant(id) {
      if (!confirm('Delete this plant profile?')) return;
      plants = plants.filter(p => p.id !== id);
      saveData();
      renderSchedule();
    }

    function renderSchedule() {
      const container = document.getElementById('plant-list');
      container.innerHTML = '';

      if (plants.length === 0) {
        container.innerHTML = '<div style="opacity:0.6; padding: 20px 0;">No plants registered yet. Tap "+ Bulk Register Plants" above.</div>';
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0); 

      plants.forEach(plant => {
        const safeDate = plant.lastFertilized || getTodayInputFormat();
        const lastDate = new Date(safeDate);
        lastDate.setHours(0, 0, 0, 0);
        
        const diffTime = today - lastDate;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const daysLeft = plant.interval - diffDays;

        const nextDate = new Date(lastDate);
        nextDate.setDate(lastDate.getDate() + plant.interval);

        let badgeClass = 'badge-good';
        let badgeText = `${daysLeft} days left`;

        if (daysLeft === 0) {
          badgeClass = 'badge-due';
          badgeText = 'Due Today';
        } else if (daysLeft < 0) {
          badgeClass = 'badge-overdue';
          badgeText = `Overdue ${Math.abs(daysLeft)}d`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="plant-header">
            <div>
              <div class="plant-title">${plant.name}</div>
              <div class="plant-type">${plant.type} • Every ${plant.interval} days</div>
            </div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>

          <div class="date-grid">
            <div class="date-row">
              <span class="date-label">Last Fed:</span>
              <input type="date" class="date-input-inline" value="${safeDate}" onchange="editFertilizerDate('${plant.id}', this.value)">
            </div>
            <div class="date-row">
              <span class="date-label">Next Due:</span>
              <span class="date-val">${formatDateDisplay(nextDate)}</span>
            </div>
          </div>

          <button class="btn btn-primary" onclick="waterPlant('${plant.id}')">Log Today & Reset Timer</button>
          
          <div class="btn-row">
            <button class="btn btn-secondary btn-half" onclick="openEditModal('${plant.id}')">Edit Settings</button>
            <button class="btn btn-secondary btn-half" onclick="deletePlant('${plant.id}')">Delete Plant</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function runCalcuMontserratr() {
      const vol = parseFloat(document.getElementById('calc-volume').value) || 0;
      const recipeKey = document.getElementById('calc-recipe').value;
      const recipe = recipeDb[recipeKey];
      const output = document.getElementById('recipe-output');
      
      let html = '';
      if (recipe && recipe.ingredients.length > 0) {
        recipe.ingredients.forEach(ing => {
          const minTotal = (ing.min * vol).toFixed(2);
          const maxTotal = (ing.max * vol).toFixed(2);
          
          let displayVal = "";
          if (ing.min === ing.max) {
            displayVal = `${minTotal} ${ing.unit}`;
          } else {
            displayVal = `${minTotal} – ${maxTotal} ${ing.unit}`;
          }

          const labelName = ing.optional ? `${ing.name} <span style="font-size: 11px; opacity: 0.6;">(Optional)</span>` : ing.name;

          html += `<div class="calc-row">
                     <span>${labelName}:</span>
                     <span class="calc-val">${displayVal}</span>
                   </div>`;
        });
      } else {
        html = `<div style="opacity:0.6; font-size: 14px;">No ingredients configured.</div>`;
      }
      output.innerHTML = html;
    }

    function renderLogs() {
      const container = document.getElementById('logs-list');
      container.innerHTML = '';

      if (logs.length === 0) {
        container.innerHTML = '<div style="opacity:0.6; padding: 12px 0;">No fertilization history yet.</div>';
        return;
      }

      logs.slice(0, 30).forEach(log => {
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div><strong>${log.plantName}</strong><br><span style="font-size: 11px; opacity: 0.7;">${log.type}</span></div>
          <div style="opacity: 0.7; text-align: right;">${log.date}</div>
        `;
        container.appendChild(item);
      });
    }

    // iOS Safari Compatible JSON Export
    function exportJSON() {
      const jsonString = JSON.stringify({ plants, logs }, null, 2);
      const blob = new Blob([jsonString], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      
      const downloadAnchor = document.createElement('a');
      downloadAnchor.href = url;
      downloadAnchor.download = `plant_care_backup_${new Date().toISOString().slice(0,10)}.json`;
      
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      
      setTimeout(() => {
        document.body.removeChild(downloadAnchor);
        URL.revokeObjectURL(url);
      }, 100);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.plants && imported.logs) {
            plants = imported.plants;
            logs = imported.logs;
            saveData();
            renderSchedule();
            alert('Data restored successfully!');
          }
        } catch (err) {
          alert('Invalid backup JSON file.');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
